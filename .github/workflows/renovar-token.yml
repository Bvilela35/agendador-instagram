name: Renovar token do Instagram

# O token vale 60 dias. Este workflow renova no dia 1 e 15 de cada mês.
# Só funciona se existir o secret GH_PAT (veja o README); sem ele, apenas avisa.

on:
  schedule:
    - cron: "0 12 1,15 * *"
  workflow_dispatch:

jobs:
  renovar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Renovar e salvar o token
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::Sem o secret GH_PAT. Renove o token à mão a cada ~50 dias (veja o README)."
            exit 0
          fi
          NOVO=$(python3 scheduler.py renovar-token)
          echo "::add-mask::$NOVO"
          [ -n "$NOVO" ] || { echo "::error::Token vazio, nada foi alterado."; exit 1; }
          printf '%s' "$NOVO" | gh secret set IG_ACCESS_TOKEN --repo "$GITHUB_REPOSITORY"
          echo "Secret IG_ACCESS_TOKEN atualizado."
